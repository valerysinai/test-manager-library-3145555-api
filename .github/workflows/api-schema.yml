name: API schema

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build integration runner
        run: docker build --target integration -t manager-library-api:integration .
      - name: Start isolated PostgreSQL 16
        shell: bash
        run: |
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          docker network create library-schema-ci
          docker run -d --name library-schema-db --network library-schema-ci \
            -e POSTGRES_DB=library_test -e POSTGRES_PASSWORD="$db_password" postgres:16 -c timezone=UTC
          for attempt in $(seq 1 30); do
            if docker exec library-schema-db pg_isready -h 127.0.0.1 -U postgres -d library_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify migration and engine constraints
        run: |
          mkdir -p "$RUNNER_TEMP/phpunit"
          chmod 777 "$RUNNER_TEMP/phpunit"
          set +e
          docker run --rm --network library-schema-ci \
            -v "$RUNNER_TEMP/phpunit:/diagnostics" \
            -e DB_HOST=library-schema-db -e DB_DATABASE=library_test -e DB_USERNAME=postgres -e DB_PASSWORD \
            manager-library-api:integration php vendor/bin/phpunit --configuration phpunit.integration.xml --log-junit /diagnostics/results.xml
          result=$?
          set -e
          python3 scripts/annotate_tests.py "$RUNNER_TEMP/phpunit/results.xml"
          exit "$result"
      - name: Inspect schema using the specification queries
        run: |
          docker run --rm --network library-schema-ci \
            -e DB_HOST=library-schema-db -e DB_DATABASE=library_test -e DB_USERNAME=postgres -e DB_PASSWORD \
            manager-library-api:integration php artisan migrate --force
          docker exec -i library-schema-db psql -v ON_ERROR_STOP=1 -U postgres -d library_test < tests/Fixtures/schema-inspection.sql
      - name: Remove isolated test resources
        if: always()
        run: |
          docker rm -f -v library-schema-db || true
          docker network rm library-schema-ci || true
